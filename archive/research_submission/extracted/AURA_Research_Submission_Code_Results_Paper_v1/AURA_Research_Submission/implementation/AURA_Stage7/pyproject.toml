[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-verifier-stage7"
version = "0.7.0"
description = "AURA Stage 7: controlled multi-policy validation and evidence verification"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["aura_evidence*", "aura_verifier*", "aura_reasoning*", "aura_planning*", "aura_external*", "aura_baselines*", "aura_evaluation*"]
