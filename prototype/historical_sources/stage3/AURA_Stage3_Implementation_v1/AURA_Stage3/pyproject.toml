[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-verifier-stage3"
version = "0.3.0"
description = "AURA Stage 3: contract-defined task completion verifier over trusted evidence"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["aura_evidence*", "aura_verifier*"]
